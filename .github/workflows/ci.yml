name: findPostcode CI pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.13, 3.14]

    env:
      DEBUG: ${{ secrets.DEBUG }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
      MAX_BATCH_POSTCODES: ${{ secrets.MAX_BATCH_POSTCODES }}
      DAILY_THROTTLE_RATE: ${{ secrets.DAILY_THROTTLE_RATE }}
      PERMIN_THROTTLE_RATE: ${{ secrets.PERMIN_THROTTLE_RATE }}
      CELERY_BROKER_URL: ${{ secrets.CELERY_BROKER_URL }}
      CELERY_RESULT_BACKEND: ${{ secrets.CELERY_RESULT_BACKEND }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      MINIO_BUCKET_NAME: ${{ secrets.MINIO_BUCKET_NAME }}
      MINIO_ENDPOINT_URL: ${{ secrets.MINIO_ENDPOINT_URL }}
      MINIO_CUSTOM_DOMAIN: ${{ secrets.MINIO_CUSTOM_DOMAIN }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Tests
      run: |
        python manage.py test
  
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env
        env:
          DEBUG: ${{ secrets.DEBUG }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          MAX_BATCH_POSTCODES: ${{ secrets.MAX_BATCH_POSTCODES }}
          DAILY_THROTTLE_RATE: ${{ secrets.DAILY_THROTTLE_RATE }}
          PERMIN_THROTTLE_RATE: ${{ secrets.PERMIN_THROTTLE_RATE }}
          CELERY_BROKER_URL: ${{ secrets.CELERY_BROKER_URL }}
          CELERY_RESULT_BACKEND: ${{ secrets.CELERY_RESULT_BACKEND }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET_NAME: ${{ secrets.MINIO_BUCKET_NAME }}
          MINIO_ENDPOINT_URL: ${{ secrets.MINIO_ENDPOINT_URL }}
          MINIO_CUSTOM_DOMAIN: ${{ secrets.MINIO_CUSTOM_DOMAIN }}
        run: |
          cat > .env << EOF
          DEBUG=$DEBUG
          SECRET_KEY=$SECRET_KEY
          ALLOWED_HOSTS=$ALLOWED_HOSTS
          MAX_BATCH_POSTCODES=$MAX_BATCH_POSTCODES
          DAILY_THROTTLE_RATE=$DAILY_THROTTLE_RATE
          PERMIN_THROTTLE_RATE=$PERMIN_THROTTLE_RATE
          CELERY_BROKER_URL=$CELERY_BROKER_URL
          CELERY_RESULT_BACKEND=$CELERY_RESULT_BACKEND
          MINIO_ACCESS_KEY=$MINIO_ACCESS_KEY
          MINIO_SECRET_KEY=$MINIO_SECRET_KEY
          MINIO_BUCKET_NAME=$MINIO_BUCKET_NAME
          MINIO_ENDPOINT_URL=$MINIO_ENDPOINT_URL
          MINIO_CUSTOM_DOMAIN=$MINIO_CUSTOM_DOMAIN
          EOF

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for api to be healthy
        run: |
          until docker compose ps api | grep -q "healthy"; do
            echo "Waiting for api to be healthy..."
            sleep 2
          done

      - name: Run tests
        run: docker compose exec -T api python manage.py test

      - name: Tear down
        run: docker compose down
