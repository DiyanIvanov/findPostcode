services:
  redis:
    container_name: redis
    image: redis:8.4.2-alpine3.22
    volumes:
      - 'redis_data:/data'

  minio:
    container_name: minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z  # latest stable
    ports:
      - '9000:9000'
#      - '9001:9001'   # Uncomment for Web console
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server --console-address ":9001" /data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # creates bucket automatically on startup
  minio_init:
    container_name: bucket-init
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing myminio/${MINIO_BUCKET_NAME};
      mc anonymous set none myminio/${MINIO_BUCKET_NAME};
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}

  celery:
    build: .
    container_name: celery
    depends_on:
      - redis
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      MAX_BATCH_POSTCODES: ${MAX_BATCH_POSTCODES}
      DAILY_THROTTLE_RATE: ${DAILY_THROTTLE_RATE}
      PERMIN_THROTTLE_RATE: ${PERMIN_THROTTLE_RATE}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    command: "celery -A findPostcode worker --loglevel=info -P solo"
    restart: unless-stopped

  api:
    build: .
    container_name: findPostcode
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - celery
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      MAX_BATCH_POSTCODES: ${MAX_BATCH_POSTCODES}
      DAILY_THROTTLE_RATE: ${DAILY_THROTTLE_RATE}
      PERMIN_THROTTLE_RATE: ${PERMIN_THROTTLE_RATE}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "manage.py", "check" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  minio_data:
  redis_data: