services:
  redis:
    container_name: redis
    image: redis:8.4.2-alpine3.22

  minio:
    container_name: minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - 'minio_data:/data'
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    command: server --console-address ":9001" /data

  celery:
    build: .
    container_name: celery
    depends_on:
      - redis
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      MAX_BATCH_POSTCODES: ${MAX_BATCH_POSTCODES}
      DAILY_THROTTLE_RATE: ${DAILY_THROTTLE_RATE}
      PERMIN_THROTTLE_RATE: ${PERMIN_THROTTLE_RATE}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    command: "celery -A findPostcode worker --loglevel=info -P solo"
    restart: unless-stopped

  api:
    build: .
    container_name: findPostcode
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - celery
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      MAX_BATCH_POSTCODES: ${MAX_BATCH_POSTCODES}
      DAILY_THROTTLE_RATE: ${DAILY_THROTTLE_RATE}
      PERMIN_THROTTLE_RATE: ${PERMIN_THROTTLE_RATE}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "manage.py", "check" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  minio_data: